<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="Report.css">

    <title>NaijaPrice</title>
</head>
<body>
    <div class="header">
    <nav class="navbar navbar-expand-lg">
    <div class="container">

        <a href="#" class="navbar-brand d-flex align-items-center me-5">
            <i class="fa-solid fa-naira-sign fs-3 me-2"></i>
            <span>NairaPrice</span>
        </a>

        <form class="d-flex mx-auto search-form" role="search">
            <div class="input-group">
              <span class="input-group-text">
                  <i class="fa-solid fa-magnifying-glass"></i>
              </span>

              <input type="search" class="form-control search-box" placeholder="Search, Items, markets...">
            
            </div>
        </form>
        <div class="side-icon">
          <i class="fa-solid fa-wifi"></i> 
          <i class="fa-regular fa-moon"></i> 
        </div>
        

    </div>
    </nav>

    <nav class="navbar navbar-expand-lg ">

        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link"  href="index.html"><i class="fa-solid fa-border-all"></i> Market</a>
        </li>
        <li class="nav-item">
          <a class="nav-link"  href="Compare.html"> <i class="fa-solid fa-chart-simple"></i> Compare</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="Report.html"><i class="fa-regular fa-pen-to-square"></i> Report</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="Profile.html"><i class="fa-regular fa-user"></i> Profile</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="Admin.html"><i class="fa-solid fa-shield"></i> Admin</a>
        </li>
      </ul>
    </div>
    </div>
    </nav> 

    </div>

    <div class="main-container">
        <div class="head">
         <h6 class="price-comprisation pt-4">
            <span><i class="fa-regular fa-paper-plane"></i>
            </span>Report a Price</h6>
            <small class="help">Help the community with accurate market data</small>
        </div>

    <div class="container-f">
        <div class="select-1">
        <h6>Item</h6>
        <select class="form-select" aria-label="Default select example">
        <option selected>Imported Rice (Thai)</option>
        <option value="1">Local Rice (Ofada)</option>
        <option value="2">Brown Beans (oloyin)</option>
        <option value="3">Garri (White)</option>
        <option value="4">Tomato Stew Base</option>
        <option value="5">Palm Oil</option>
        <option value="6">Petrol (PMS)</option>
        <option value="7">Diesel (AGO)</option>
        <option value="8">Kerosene (DPK)</option>
        <option value="9">Cooking Gas (LPG)</option>
        <option value="10">Cement</option>
        <option value="11">Sugar</option>
        <option value="12">Bread (Agege)</option>
        <option value="12">Egg (Crate)</option>
        </select>
        </div>

        <div class="select-1">
        <h6>Price</h6>
        <input class="price" type="number" id="quantity" name="quantity" min="1" max="5000" placeholder="e.g 2500">
        </div>

        <div class="half-input">

            <div class="select-1">
                <h6>Market</h6>
                <div class="input-group market">
                    <input type="search" class="form-control search-input-1" placeholder="E.g Mile 12">
                    
                    </div>
            </div>

            <div class="select-1">
                <h6>City</h6>
                <select class="form-select" aria-label="Default select example">
                <option selected>Lagos</option>
                <option value="1">Abuja</option>
                <option value="2">Benin</option>
                <option value="3">Three</option>
                <option value="4">Enugu</option>
                <option value="5">Ibadan</option>
                <option value="6">Kaduna</option>
                <option value="7">Kano</option>
                <option value="8">Port Harcourt</option>
                </select>
            </div>
        
        </div>
        
        <div class="submit-button">
            <button type="button" class="btn btn-primary btn-lg submit-button">
                 <span><i class="fa-regular white-plane fa-paper-plane"></i>
            </span>
                <small>Submit Report</small></button>
        </div>

    </div>
    </div>
    


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
